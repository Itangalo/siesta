[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "siesta"
version = "0.1.0"
description = "Siesta solitaire with a local web UI and training pipeline."
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
